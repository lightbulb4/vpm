name: Build Repo Listing

on: 
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: main
    paths: source.json

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  
# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:
  
  build-listing:
    name: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      
      - uses: actions/checkout@v4 # check out this repo
      - uses: actions/checkout@v4 # check out automation repo
        with:
          repository: vrchat-community/package-list-action
          path: ${{env.pathToCi}}
          clean: false # otherwise the local repo will no longer be checked out
          
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{env.pathToCi}}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}
          
      - name: Build Package Version Listing
        # The upstream wrapper builds net6.0 and net8.0 into the same output directory.
        # Build only net8.0 so the executable cannot be overwritten by the net6.0 build.
        run: |
          dotnet build "${{env.pathToCi}}/PackageBuilder/PackageBuilder.csproj" --framework net8.0 /nodeReuse:false /p:UseSharedCompilation=false --verbosity quiet
          dotnet run --project "${{env.pathToCi}}/PackageBuilder/PackageBuilder.csproj" --no-build --framework net8.0 -- BuildMultiPackageListing --root "${{env.pathToCi}}" --list-publish-directory "$GITHUB_WORKSPACE/${{env.listPublishDirectory}}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{env.listPublishDirectory}}
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
